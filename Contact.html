  <main>
    <!-- Blank layout section utilizing your existing structural container classes -->

      <div class="container">
        <header class="section-header">
          <h2>Contact</h2>
          <!--form action="https://api.web3forms.com/submit" method="POST">
                < Your secret access key provided by the service >
                <input type="hidden" name="access_key" value="fd6ebe49-1b90-4e25-a51c-09b72cf596c5">

                <textarea name="message" placeholder="Your Message" required></textarea>

                <button type="submit">Send Message</button>
          </form-->
          <form id="contact-form">
            <input type="email" id="email" required placeholder="Your Email">
            <textarea id="message" required placeholder="Your Message"></textarea>
            
            <!-- Hidden honeypot field to fool spam bots -->
            <input type="text" id="honeypot" style="display:none;" tabindex="-1" autocomplete="off">
            
            <button type="submit" id="submit-btn">Send Message</button>
            <p id="response-status"></p>
            </form>

            <script>
                document.getElementById('contact-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const statusText = document.getElementById('response-status');
                    const submitBtn = document.getElementById('submit-btn');
                    
                    submitBtn.disabled = true;
                    statusText.innerText = 'Sending...';

                    const payload = {
                    email: document.getElementById('email').value,
                    message: document.getElementById('message').value,
                    honeypot: document.getElementById('honeypot').value
                    };

                    try {
                    const res = await fetch('send_email.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();

                    if (res.ok) {
                        statusText.innerText = 'Thank you! Your message was sent.';
                        document.getElementById('contact-form').reset();
                    } else {
                        statusText.innerText = data.error || 'Something went wrong.';
                    }
                    } catch (err) {
                    statusText.innerText = 'Failed to submit form.';
                    } finally {
                    submitBtn.disabled = false;
                    }
                });
            </script>
          <p>Placeholder</p>
